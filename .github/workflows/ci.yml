name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Migration validation
        run: npm run check:migrations

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke tests
        run: npx playwright test
        env:
          CI: true

  supabase-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Ensure PostgreSQL client is available
        run: |
          if ! command -v psql > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

      - name: Start fresh disposable Supabase stack
        run: npx --no-install supabase start

      - name: Install Chromium for authenticated browser checks
        run: npx --no-install playwright install --with-deps chromium

      - name: Verify Auth, PostgREST, Storage, SQL and browser workflows
        run: node scripts/check-local-supabase.mjs --browser

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-browser-results
          path: test-results/supabase-browser.json
          if-no-files-found: ignore

      - name: Stop disposable stack
        if: always()
        run: npx --no-install supabase stop
